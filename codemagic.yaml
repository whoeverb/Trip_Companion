workflows:
  ios-build:
    name: iOS Build
    environment:
      flutter: 3.19.0
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Fetch Flutter Dependencies
        script: |
          flutter pub get

      - name: Build iOS App
        script: |
          # Build the Flutter assets first
          flutter build ios --release --no-codesign --config-only
          # Build the Xcode project with signing disabled
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -sdk iphoneos -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        script: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Runner.ipa Payload

    artifacts:
      - "Runner.ipa"
