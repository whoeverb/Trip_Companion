workflows:
  ios-build:
    name: iOS Build
    environment:
      flutter: 3.19.0
      groups:
        - macos_credentials
      vars:
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Fetch Flutter Dependencies
        script: |
          flutter pub get

      - name: Build Unsigned iOS App Bundle
        script: |
          flutter build ios --release --no-codesign --project-name="Runner" DEVELOPMENT_TEAM=TEAMXYZ123

      - name: Clean Previous Assembly Artifacts
        script: |
          rm -rf Payload
          rm -f *.ipa

      - name: Assemble Traditional Payload Architecture
        script: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/

      - name: Pack IPA and Stage to Codemagic Output Directory
        script: |
          zip -r trip_companion.ipa Payload

    artifacts:
      - "trip_companion.ipa"