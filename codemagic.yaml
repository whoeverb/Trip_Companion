workflows:
  ios-build:
    name: iOS Build
    environment:
      flutter: 3.19.0
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Fetch Flutter Dependencies
        script: |
          flutter pub get

      - name: Generate Icons
        script: |
          dart run flutter_launcher_icons

      - name: Patch Xcode project to disable all code signing
        script: |
          PROJECT_FILE="ios/Runner.xcodeproj/project.pbxproj"
          
          # Remove any development team
          sed -i '' 's/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = "";/g' "$PROJECT_FILE"
          
          # Set provisioning style to Manual
          sed -i '' 's/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g' "$PROJECT_FILE"
          
          # Clear provisioning profile specifier
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = [^;]*;/PROVISIONING_PROFILE_SPECIFIER = "";/g' "$PROJECT_FILE"
          
          # Disable code signing requirement
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES;/CODE_SIGNING_REQUIRED = NO;/g' "$PROJECT_FILE"
          sed -i '' 's/CODE_SIGNING_ALLOWED = YES;/CODE_SIGNING_ALLOWED = NO;/g' "$PROJECT_FILE"

          # Set code sign identity to empty for all configurations
          sed -i '' 's/CODE_SIGN_IDENTITY = [^;]*;/CODE_SIGN_IDENTITY = "";/g' "$PROJECT_FILE"
          sed -i '' 's/\"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]\" = [^;]*;/"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "";/g' "$PROJECT_FILE"

          echo "Patched project.pbxproj:"
          grep -E "(DEVELOPMENT_TEAM|CODE_SIGN|PROVISIONING)" "$PROJECT_FILE" | sort -u

      - name: Build iOS App (No Code Sign)
        script: |
          flutter build ios --release --no-codesign

      - name: Package IPA
        script: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Runner.ipa Payload/
          echo "IPA size: $(du -sh Runner.ipa)"

    artifacts:
      - "Runner.ipa"