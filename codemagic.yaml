workflows:
  ios-build:
    name: iOS Build
    environment:
      flutter: 3.19.0
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Fetch Flutter Dependencies
        script: |
          flutter pub get

      - name: Generate Icons
        script: |
          dart run flutter_launcher_icons

      - name: Patch Xcode project to disable all code signing
        script: |
          PROJECT_FILE="ios/Runner.xcodeproj/project.pbxproj"
          sed -i '' 's/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = "";/g' "$PROJECT_FILE"
          sed -i '' 's/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g' "$PROJECT_FILE"
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = [^;]*;/PROVISIONING_PROFILE_SPECIFIER = "";/g' "$PROJECT_FILE"
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES;/CODE_SIGNING_REQUIRED = NO;/g' "$PROJECT_FILE"
          sed -i '' 's/CODE_SIGNING_ALLOWED = YES;/CODE_SIGNING_ALLOWED = NO;/g' "$PROJECT_FILE"
          sed -i '' 's/CODE_SIGN_IDENTITY = [^;]*;/CODE_SIGN_IDENTITY = "";/g' "$PROJECT_FILE"
          sed -i '' 's/\"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]\" = [^;]*;/"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "";/g' "$PROJECT_FILE"

      - name: Inject API key into Info.plist
        script: |
          /usr/libexec/PlistBuddy -c "Add :GOOGLE_MAPS_API_KEY string $GOOGLE_MAPS_API_KEY" ios/Runner/Info.plist

      - name: Generate Flutter assets and engine
        script: |
          flutter build ios --release --no-codesign --config-only \
            --dart-define=GOOGLE_MAPS_API_KEY=$GOOGLE_MAPS_API_KEY || true

      - name: Build with xcodebuild directly
        script: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY_HASH="" \
            BUILD_DIR="$(pwd)/build/ios" \

      - name: Find and verify app bundle
        script: |
          echo "=== Searching entire build directory ==="
          find "$(pwd)/build" -name "*.app" -type d 2>/dev/null
          echo ""
          echo "=== Full build/ios tree (2 levels) ==="
          find "$(pwd)/build/ios" -maxdepth 4 -type d 2>/dev/null
          echo ""
          echo "=== Looking for Info.plist anywhere ==="
          find "$(pwd)/build" -name "Info.plist" 2>/dev/null

      - name: Package IPA
        script: |
          APP_PATH=$(find "$(pwd)/build" -name "Runner.app" -type d | grep -v "Intermediates" | head -1)
          echo "Using app at: $APP_PATH"
          
          # Verify Info.plist exists before packaging
          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "ERROR: Info.plist missing from $APP_PATH"
            ls -la "$APP_PATH"
            exit 1
          fi
          
          echo "Info.plist found, proceeding..."
          rm -rf Payload
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/Runner.app
          
          # Verify copy
          ls -la Payload/Runner.app/
          
          zip -r Runner.ipa Payload/
          echo "IPA size: $(du -sh Runner.ipa)"

    artifacts:
      - "Runner.ipa"