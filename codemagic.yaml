workflows:
  ios-build:
    name: iOS Build
    environment:
      flutter: 3.19.0
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Fetch Flutter Dependencies
        script: |
          flutter pub get

      - name: Generate Icons
        script: |
          dart run flutter_launcher_icons

      - name: Disable Code Signing in Xcode Project
        script: |
          cd ios
          # Disable signing for all targets
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = /PRODUCT_BUNDLE_IDENTIFIER = /g' Runner.xcodeproj/project.pbxproj
          # Set signing to manual with empty identity
          /usr/libexec/PlistBuddy -c "Set :PROVISIONING_PROFILE_SPECIFIER ''" Runner.xcodeproj/project.pbxproj 2>/dev/null || true

      - name: Build iOS App (No Code Sign)
        script: |
          flutter build ios --release --no-codesign

      - name: Package IPA
        script: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Runner.ipa Payload/
          echo "IPA created: $(du -sh Runner.ipa)"

    artifacts:
      - "Runner.ipa"